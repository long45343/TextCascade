name: CI

on:
  push:
    branches: [v2]
  pull_request:
    branches: [v2]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.caching=true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/v2' }}

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Stage debug APK
        if: always()
        run: |
          mkdir -p staging
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          if ls app/build/outputs/apk/debug/*.apk 1> /dev/null 2>&1; then
            cp app/build/outputs/apk/debug/*.apk "staging/TextCascade-${SHORT_SHA}-debug.apk"
          fi

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.sha }}
          path: staging/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: warn
          retention-days: 14
