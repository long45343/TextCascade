name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.caching=true"
      TEXTCASCADE_KS_PASSWORD: ${{ secrets.TEXTCASCADE_KS_PASSWORD }}
      TEXTCASCADE_KEY_PASSWORD: ${{ secrets.TEXTCASCADE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore
        if: ${{ env.TEXTCASCADE_KS_BASE64 != '' }}
        env:
          TEXTCASCADE_KS_BASE64: ${{ secrets.TEXTCASCADE_KS_BASE64 }}
        run: |
          printf '%s' "$TEXTCASCADE_KS_BASE64" | base64 -d > textcascade-release.jks
          echo "Restored keystore ($(wc -c < textcascade-release.jks) bytes)"

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Assemble signed release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Stage APKs
        run: |
          mkdir -p staging
          cp app/build/outputs/apk/debug/*.apk "staging/TextCascade-${GITHUB_REF_NAME}-debug.apk"
          cp app/build/outputs/apk/release/*.apk "staging/TextCascade-${GITHUB_REF_NAME}-release.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: staging/*.apk
