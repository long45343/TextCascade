plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "com.textcascade"
    compileSdk 34

    defaultConfig {
        applicationId "com.textcascade"
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName "0.3.0"
        // R13: 测试配置
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        create("release") {
            storeFile file("${rootProject.projectDir}/textcascade-release.jks")
            // R15: 签名密码从环境变量或 gradle.properties 读取，回退默认值
            storePassword System.getenv("TEXTCASCADE_KS_PASSWORD") ?: findProperty("keystorePassword") ?: "android"
            keyAlias "textcascade"
            keyPassword System.getenv("TEXTCASCADE_KEY_PASSWORD") ?: findProperty("keyPassword") ?: "android"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    // R13: 单元测试配置
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    packaging {
        resources {
            merges += "META-INF/xposed/*"
        }
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.13.0"
    compileOnly "io.github.libxposed:api:102.0.0"
    // R13: 测试依赖（testImplementation，不进入运行时 classpath）
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.13"
    testImplementation "androidx.test:core:1.6.1"
    testImplementation "androidx.test.ext:junit:1.2.1"
}
